[tool.poetry]
name = "topdown-profiler"
version = "0.3.1"
description = "Linux CPU TMA for Intel, AMD Zen and ARM Neoverse; native Apple M1/M6 CPU/GPU profiling; CLI, MCP, SQLite and PostgreSQL."
authors = ["redis-performance"]
readme = "README.md"
license = "MIT"
packages = [{include = "topdown"}]
keywords = ["pmu", "toplev", "topdown", "profiler", "performance", "mcp", "arm", "neoverse", "graviton", "apple-silicon", "m1", "m6", "gpu", "metal"]

[tool.poetry.scripts]
topdown = "topdown.cli:app_main"

[tool.poetry.dependencies]
python = "^3.10"
typer = ">=0.9.0"
rich = ">=13.0.0"
# MCP 2 moved FastMCP; 1.24 avoids removed Pydantic internal APIs.
mcp = {version = ">=1.24.0,<2", extras = ["cli"]}
psycopg = {version = ">=3.1.0", extras = ["binary"], optional = true}

[tool.poetry.extras]
postgresql = ["psycopg"]
oauth = ["PyJWT", "cryptography"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^6.0.0"
psycopg = {version = ">=3.1.0", extras = ["binary"]}
ruff = "^0.15.9"
pytest-asyncio = "^1.3.0"

[tool.ruff]
line-length = 120

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
